name: Deploy docs to GitHub Pages

# Rebuilds the site on pushes to main and whenever a release is
# published.
#
# Prose comes from the working tree, so a docs fix goes live on push.
# The download-facing data -- index.txt and the per-package versions --
# is taken from the latest release's assets instead, because Pages
# deploys on every push while archives only publish on a tag. Without
# that split the site advertises packages added since the last tag and
# `get` 404s on them, which is exactly what happened to webi, btop,
# shfmt and socat.

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # PyYAML is only used to validate the generated frontmatter --
      # the generator runs without it, just without that check, so this
      # is deliberately a separate, non-fatal step.
      - name: Install PyYAML (frontmatter validation)
        run: python3 -m pip install --quiet pyyaml || true

      # The asset list of the latest release. A package absent from it
      # is left out of index.txt entirely, so the site can only ever
      # advertise something `get` can actually fetch.
      - name: Fetch the latest release's asset list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view --repo "$GITHUB_REPOSITORY" \
               --json assets -q '.assets[].name' > release-assets.txt; then
            echo "latest release: $(wc -l < release-assets.txt) assets"
          else
            # No release yet (a fresh fork, or before the first tag).
            # Fall back to describing the working tree rather than
            # failing the deploy.
            echo "no release found -- generating from the working tree"
            rm -f release-assets.txt
          fi

      - name: Generate docs, bootstrap and index
        run: |
          set -euo pipefail
          if [ -f release-assets.txt ]; then
            UNFLAB_RELEASE_MANIFEST=release-assets.txt scripts/generate-docs.py
          else
            scripts/generate-docs.py
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - run: npm install -g @docmd/core@0.9.2
      - run: docmd build

      # `get` and `index.txt` are served as-is: the bootstrap has to come
      # back as a shell script, not a rendered HTML page, or `curl | sh`
      # would pipe markup into a shell.
      - name: Add bootstrap and index to the built site
        run: |
          set -euo pipefail
          cp site-extra/get site/get
          cp site-extra/unflab site/unflab
          cp site-extra/index.txt site/index.txt
          # Served without an extension, so make sure it looks right.
          head -1 site/get
          test "$(head -c 2 site/get)" = '#!'

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  # Deploying needs Pages enabled, which GitHub does not offer for
  # private repositories on all plans. The build job above still runs on
  # every push -- it's a genuine check that the generator, the bootstrap
  # substitution and docmd all work -- but the deploy is skipped rather
  # than failing the workflow until the repo is public (or Pages is
  # otherwise enabled). Flip UNFLAB_PAGES to '1' as a repo variable to
  # turn deployment on.
  deploy:
    if: vars.UNFLAB_PAGES == '1'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
