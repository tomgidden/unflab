name: Deploy docs to GitHub Pages

# Rebuilds the site on pushes to main and whenever a release is
# published, so the utility table and the bootstrap's index.txt track the
# latest release rather than waiting for an unrelated commit.

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate docs, bootstrap and index from the recipes
        run: scripts/generate-docs.sh

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: npm install -g @docmd/core@0.9.2
      - run: docmd build

      # `get` and `index.txt` are served as-is: the bootstrap has to come
      # back as a shell script, not a rendered HTML page, or `curl | sh`
      # would pipe markup into a shell.
      - name: Add bootstrap and index to the built site
        run: |
          set -euo pipefail
          cp site-extra/get site/get
          cp site-extra/index.txt site/index.txt
          # Served without an extension, so make sure it looks right.
          head -1 site/get
          test "$(head -c 2 site/get)" = '#!'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  # Deploying needs Pages enabled, which GitHub does not offer for
  # private repositories on all plans. The build job above still runs on
  # every push -- it's a genuine check that the generator, the bootstrap
  # substitution and docmd all work -- but the deploy is skipped rather
  # than failing the workflow until the repo is public (or Pages is
  # otherwise enabled). Flip UNFLAB_PAGES to '1' as a repo variable to
  # turn deployment on.
  deploy:
    if: vars.UNFLAB_PAGES == '1'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
