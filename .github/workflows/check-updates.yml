name: Check upstream versions

# Nightly report of recipes whose upstream has released a newer version.
#
# It reports; it never bumps. A version change also means a new
# UNFLAB_SHA256, and that is the only integrity check this project
# has across upstreams that mostly don't sign their releases. It's
# the one bit we need to do manually to make sure tampering is noticed.
#
# The report goes to the run summary only. bump.yml opens a pull request
# for each update, and a check that breaks fails this run, so a tracking
# issue would only repeat one or the other.

on:
  schedule:
    # 06:34 UTC. Off the hour because the top of the hour is when
    # everyone else's cron fires and GitHub queues them.
    - cron: "34 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # GH_TOKEN raises the GitHub API rate limit from 60/hour
      # (unauthenticated, shared across every runner on the host) to
      # 1000/hour for this repo.
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          scripts/check-updates.sh | tee report.txt
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo '### Upstream versions'
            echo
            echo '```'
            cat report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - if: steps.check.outputs.status != '0'
        run: |
          echo "one or more version checks failed" >&2
          exit 1
