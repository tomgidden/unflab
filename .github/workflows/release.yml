name: Release

# Run by hand (Actions > Release > Run workflow, or `gh workflow run
# release.yml`) to tag main and release it; pushing a v* tag yourself
# still works too.
#
# The release job only runs if every recipe succeeded, so a partial
# release can't be published.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Z for packages, Y for the installer or build scripts"
        type: choice
        options: [Z, Y]
        default: Z
      summary:
        description: "Tag subject after the version (blank = recipes changed)"
        required: false
      dry_run:
        description: "Say what would be tagged, and stop"
        type: boolean
        default: false

permissions:
  contents: write
  # actions: write is for the pages.yml dispatch at the end of the
  # release job; without it the dispatch is refused with a 403.
  actions: write

jobs:
  # Only when run by hand: tag main's HEAD, then release that tag below.
  # The tag is made here rather than pushed for another run to pick up,
  # because a push made with GITHUB_TOKEN triggers no workflow.
  tag:
    name: Tag main
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
          SUMMARY: ${{ inputs.summary }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)

          if git tag --points-at "$head" | grep -q '^v'; then
            echo "main ($head) is already tagged: $(git tag --points-at "$head")" >&2
            exit 1
          fi

          # Green at HEAD, not merely recently: build.yml diffs from the
          # last green commit, so a pass here covers everything since.
          state=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml \
                    --branch main --commit "$head" --limit 20 \
                    --json event,status,conclusion \
                    -q '[.[] | select(.event != "pull_request")][0] | "\(.status) \(.conclusion)"')
          case "$state" in
            "completed success") ;;
            "") echo "no Build run on main at $head" >&2; exit 1 ;;
            *)  echo "Build on main at $head is '$state', not green" >&2; exit 1 ;;
          esac

          prev=$(git tag -l 'v*' --sort=-v:refname | head -1)
          IFS=. read -r x y z <<< "${prev#v}"
          case "$BUMP" in
            Y) next="v$x.$((y + 1)).0" ;;
            *) next="v$x.$y.$((z + 1))" ;;
          esac

          # What the release will rebuild: recipes whose build-key
          # inputs changed since the last tag. Not affected.sh, which
          # also rebuilds for CI-only changes that alter no artefact.
          recipes=""
          for r in $(scripts/resolve.sh list-recipes); do
            # shellcheck disable=SC2046
            if ! git diff --quiet "$prev" HEAD -- $(scripts/build-key.sh --inputs "$r"); then
              recipes="$recipes $r"
            fi
          done
          if [ -z "$recipes" ]; then
            echo "nothing since $prev changes an artefact -- no release needed" >&2
            exit 1
          fi

          ver() { git show "$1:utils/$2/recipe.sh" 2>/dev/null |
                    sed -n 's/^UNFLAB_VERSION=//p' | head -1; }
          body=""
          names=""
          for r in $recipes; do
            old=$(ver "$prev" "$r"); new=$(ver HEAD "$r")
            if [ -z "$old" ]; then line="$r $new (new)"
            elif [ "$old" != "$new" ]; then line="$r $old -> $new"
            else line="$r $new (rebuilt)"
            fi
            body="$body- $line"$'\n'
            names="$names, $r"
          done
          names=${names#, }
          [ "$(echo "$recipes" | wc -w)" -gt 8 ] && names="$(echo "$recipes" | wc -w | tr -d ' ') recipes"

          msg="$next -- ${SUMMARY:-$names}"$'\n\n'"$body"
          echo "$msg"

          if [ "$DRY_RUN" = true ]; then
            echo "dry run: not tagging"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s' "$msg" | git tag -a "$next" -F -
          git push origin "$next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

  recipes:
    name: List recipes
    needs: tag
    # A skipped tag job (a tag push) must not skip everything after it,
    # hence the explicit condition here and on each job below. A dry run
    # tags nothing, and stops here.
    if: ${{ !failure() && !cancelled() && (github.event_name != 'workflow_dispatch' || needs.tag.outputs.tag != '') }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - id: ref
        run: echo "ref=${{ needs.tag.outputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.ref }}
      - id: list
        run: |
          set -euo pipefail
          names=$(scripts/resolve.sh list-recipes)
          json=$(printf '%s\n' $names | jq -R . | jq -sc .)
          echo "matrix=$json" >> "$GITHUB_OUTPUT"
          echo "Recipes: $names"

  build:
    name: ${{ matrix.recipe }} (${{ matrix.target.arch }})
    needs: recipes
    if: ${{ !failure() && !cancelled() && needs.recipes.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        recipe: ${{ fromJSON(needs.recipes.outputs.matrix) }}
        # Intel is disabled for now; uncomment to build x86_64 again.
        target:
          - runner: macos-latest
            arch: arm64-apple-darwin
          # - runner: macos-15-intel
          #   arch: x86_64-apple-darwin
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.recipes.outputs.ref }}

      # Skip the compile when nothing that determines the artefact has
      # changed. The key covers the recipe directory, the shared build
      # and packaging scripts, any helper the recipe sources, and the
      # runner image; build-key.sh documents why each matters.
      #
      # A release rebuilds every recipe, so shipping four new packages
      # was costing a full coreutils build (6m) for no change. If the
      # previous release published the same key, its archives are still
      # correct and get copied forward instead.
      - id: key
        run: |
          set -euo pipefail
          key="$(scripts/build-key.sh '${{ matrix.recipe }}' \
                   '${{ matrix.target.runner }}')"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "${{ matrix.recipe }} key: $key"

      - id: cached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "hit=false" >> "$GITHUB_OUTPUT"

          # BUILD-KEYS.txt from the previous release maps recipe -> key.
          prev=$(gh release list --repo "$GITHUB_REPOSITORY" \
                   --limit 1 --json tagName -q '.[0].tagName' || true)
          [ -n "$prev" ] || { echo "no previous release"; exit 0; }

          gh release download "$prev" --repo "$GITHUB_REPOSITORY" \
            --pattern BUILD-KEYS.txt --dir prev 2>/dev/null || {
              echo "$prev has no BUILD-KEYS.txt -- building"; exit 0; }

          want='${{ matrix.recipe }} ${{ steps.key.outputs.key }}'
          grep -qxF "$want" prev/BUILD-KEYS.txt || {
            echo "key changed since $prev -- building"; exit 0; }

          # The key matches, so reuse that release's archives for this
          # recipe. --pattern is a glob over asset names; a recipe's
          # packages are all named unflab-<pkg>-... so they have to be
          # selected via the index rather than one glob.
          mkdir -p dist
          gh release download "$prev" --repo "$GITHUB_REPOSITORY" \
            --pattern 'index.txt' --dir prev
          n=0
          # Older indexes have three columns; an empty package column
          # means the row is the package itself. Rows naming another
          # package are alternative names, with no archive of their own.
          while IFS=$'\t' read -r name recipe version kind package _; do
            [ "$recipe" = '${{ matrix.recipe }}' ] || continue
            [ "${package:-$name}" = "$name" ] || continue
            asset="unflab-$name-$version-${{ matrix.target.arch }}.tar.gz"
            gh release download "$prev" --repo "$GITHUB_REPOSITORY" \
              --pattern "$asset" --dir dist || {
                echo "$asset missing from $prev -- building instead"
                rm -rf dist; exit 0; }
            n=$((n + 1))
          done < prev/index.txt

          [ "$n" -gt 0 ] || { echo "nothing reused -- building"; exit 0; }
          echo "hit=true" >> "$GITHUB_OUTPUT"
          echo "reused $n archive(s) from $prev"

      # Toolchain setup, build and package all live in the composite
      # action, so this workflow and build.yml cannot drift apart. On a
      # cache hit the toolchains are still set up but nothing is built:
      # dist/ already holds the previous release's archives.
      - uses: ./.github/actions/build-recipe
        with:
          recipe: ${{ matrix.recipe }}
          arch: ${{ matrix.target.arch }}
          skip: ${{ steps.cached.outputs.hit == 'true' }}

      # The litmus test runs either way: a reused archive still has to
      # install and run on this runner. It is the acceptance test for
      # what ships, not for what was compiled.
      - run: scripts/litmus-test.sh ${{ matrix.target.arch }}

      - name: Record the build key
        run: echo '${{ matrix.recipe }} ${{ steps.key.outputs.key }}' > "dist/.key-${{ matrix.recipe }}"

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.recipe }}-${{ matrix.target.arch }}
          path: |
            dist/*.tar.gz
            dist/.key-*
          if-no-files-found: error
          include-hidden-files: true

  release:
    needs: [recipes, build]
    if: ${{ !failure() && !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.recipes.outputs.ref }}
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      # One line per recipe: "<recipe> <key>". The next release reads
      # this to decide what it can copy forward instead of rebuilding.
      - name: Collect build keys
        run: |
          set -euo pipefail
          cat dist/.key-* > dist/BUILD-KEYS.txt
          rm -f dist/.key-*
          sort -o dist/BUILD-KEYS.txt dist/BUILD-KEYS.txt
          echo "BUILD-KEYS.txt: $(wc -l < dist/BUILD-KEYS.txt) recipes"

      # Checksums are generated here rather than per-recipe: each build
      # job only sees its own packages, so a per-job SHA256SUMS file
      # would cover a fraction of the release and the last one uploaded
      # would win.
      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          for arch in arm64-apple-darwin x86_64-apple-darwin; do
            if ls unflab-*-"$arch".tar.gz >/dev/null 2>&1; then
              shasum -a 256 unflab-*-"$arch".tar.gz > "SHA256SUMS-$arch.txt"
              echo "SHA256SUMS-$arch.txt: $(wc -l < "SHA256SUMS-$arch.txt") entries"
            fi
          done

      # index.txt is what `get` reads to resolve a name to a release
      # asset. The generator writes it, rather than this workflow
      # rebuilding the same thing in YAML -- the column layout is a
      # contract with `get`, and one definition of it is enough.
      - name: Generate index.txt
        run: |
          set -euo pipefail
          scripts/generate-docs.py >/dev/null
          cp site-extra/index.txt dist/index.txt

      # ...then check it against the archives that actually exist, so a
      # recipe that failed to produce one can't ship an index promising
      # a download that 404s.
      - name: Check every indexed package has an archive
        run: |
          set -euo pipefail
          missing=0
          while IFS=$'\t' read -r name recipe version kind package _; do
            [ -n "$name" ] || continue
            # Stubs publish text, not archives.
            [ "${kind:-build}" = build ] || continue
            if ! ls dist/unflab-"${package:-$name}"-"$version"-*.tar.gz >/dev/null 2>&1; then
              echo "no archive for $name $version" >&2
              missing=$((missing + 1))
            fi
          done < dist/index.txt
          [ "$missing" -eq 0 ] || exit 1
          echo "index.txt: $(wc -l < dist/index.txt) packages, all present"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.recipes.outputs.ref }}
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS-*.txt
            dist/index.txt
            dist/BUILD-KEYS.txt
          generate_release_notes: true

      # The site takes index.txt and the per-package versions from the
      # latest release, so it has to redeploy once that release exists.
      #
      # pages.yml also lists `release: published`, but that trigger can
      # never fire here: GitHub does not raise workflow events for
      # anything done with the default GITHUB_TOKEN, which is what
      # publishes the release above. ("Events triggered by the
      # GITHUB_TOKEN will not create a new workflow run" -- this
      # prevents recursive runs.) workflow_dispatch is one of the
      # documented exceptions, so dispatching it explicitly is what
      # actually works.
      #
      # Without this the site keeps advertising the previous release
      # and `get` 404s on anything newer -- which is exactly what
      # happened to qpdf, subversion and tmux after v0.2.0.
      - name: Redeploy the site against the new release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
