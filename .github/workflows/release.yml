name: Release

# Cuts a release from a tag. Same per-recipe structure as the build
# workflow, so one broken recipe fails alone rather than aborting a
# serial `make all` and hiding the rest.
#
# The release job only runs if every recipe succeeded, so a partial
# release can't be published.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  recipes:
    name: List recipes
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: |
          set -euo pipefail
          names=$(ls -d utils/*/ | xargs -n1 basename | sort)
          json=$(printf '%s\n' $names | jq -R . | jq -sc .)
          echo "matrix=$json" >> "$GITHUB_OUTPUT"
          echo "Recipes: $names"

  build:
    name: ${{ matrix.recipe }} (${{ matrix.target.arch }})
    needs: recipes
    strategy:
      fail-fast: false
      matrix:
        recipe: ${{ fromJSON(needs.recipes.outputs.matrix) }}
        # Intel is disabled for now; uncomment to build x86_64 again.
        target:
          - runner: macos-latest
            arch: arm64-apple-darwin
          # - runner: macos-15-intel
          #   arch: x86_64-apple-darwin
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@v7

      - id: toolchains
        run: |
          set -euo pipefail
          need() { grep -qh "^UNFLAB_TOOLCHAIN=.*\b$1\b" "utils/${{ matrix.recipe }}/recipe.sh" && echo true || echo false; }
          echo "go=$(need go)" >> "$GITHUB_OUTPUT"
          echo "cmake=$(need cmake)" >> "$GITHUB_OUTPUT"

      - if: steps.toolchains.outputs.go == 'true'
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false

      - if: steps.toolchains.outputs.cmake == 'true'
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "3.31.6"

      # Skip the compile when nothing that determines the artefact has
      # changed. The key covers the recipe directory, the shared build
      # and packaging scripts, any helper the recipe sources, and the
      # runner image; build-key.sh documents why each matters.
      #
      # A release rebuilds every recipe, so shipping four new packages
      # was costing a full coreutils build (6m) for no change. If the
      # previous release published the same key, its archives are still
      # correct and get copied forward instead.
      - id: key
        run: |
          set -euo pipefail
          key="$(scripts/build-key.sh '${{ matrix.recipe }}' \
                   '${{ matrix.target.runner }}')"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "${{ matrix.recipe }} key: $key"

      - id: cached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "hit=false" >> "$GITHUB_OUTPUT"

          # BUILD-KEYS.txt from the previous release maps recipe -> key.
          prev=$(gh release list --repo "$GITHUB_REPOSITORY" \
                   --limit 1 --json tagName -q '.[0].tagName' || true)
          [ -n "$prev" ] || { echo "no previous release"; exit 0; }

          gh release download "$prev" --repo "$GITHUB_REPOSITORY" \
            --pattern BUILD-KEYS.txt --dir prev 2>/dev/null || {
              echo "$prev has no BUILD-KEYS.txt -- building"; exit 0; }

          want='${{ matrix.recipe }} ${{ steps.key.outputs.key }}'
          grep -qxF "$want" prev/BUILD-KEYS.txt || {
            echo "key changed since $prev -- building"; exit 0; }

          # The key matches, so reuse that release's archives for this
          # recipe. --pattern is a glob over asset names; a recipe's
          # packages are all named unflab-<pkg>-... so they have to be
          # selected via the index rather than one glob.
          mkdir -p dist
          gh release download "$prev" --repo "$GITHUB_REPOSITORY" \
            --pattern 'index.txt' --dir prev
          n=0
          while IFS=$'\t' read -r name recipe version; do
            [ "$recipe" = '${{ matrix.recipe }}' ] || continue
            asset="unflab-$name-$version-${{ matrix.target.arch }}.tar.gz"
            gh release download "$prev" --repo "$GITHUB_REPOSITORY" \
              --pattern "$asset" --dir dist || {
                echo "$asset missing from $prev -- building instead"
                rm -rf dist; exit 0; }
            n=$((n + 1))
          done < prev/index.txt

          [ "$n" -gt 0 ] || { echo "nothing reused -- building"; exit 0; }
          echo "hit=true" >> "$GITHUB_OUTPUT"
          echo "reused $n archive(s) from $prev"

      - if: steps.cached.outputs.hit != 'true'
        env:
          UNFLAB_ATTEST_CHECK: "1"
          UNFLAB_ATTEST_STRICT: "1"
        run: scripts/build.sh ${{ matrix.recipe }}
      - if: steps.cached.outputs.hit != 'true'
        run: scripts/package.sh ${{ matrix.target.arch }}

      # The litmus test runs either way: a reused archive still has to
      # install and run on this runner. It is the acceptance test for
      # what ships, not for what was compiled.
      - run: scripts/litmus-test.sh ${{ matrix.target.arch }}

      - name: Record the build key
        run: echo '${{ matrix.recipe }} ${{ steps.key.outputs.key }}' > "dist/.key-${{ matrix.recipe }}"

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.recipe }}-${{ matrix.target.arch }}
          path: |
            dist/*.tar.gz
            dist/.key-*
          if-no-files-found: error
          include-hidden-files: true

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      # One line per recipe: "<recipe> <key>". The next release reads
      # this to decide what it can copy forward instead of rebuilding.
      - name: Collect build keys
        run: |
          set -euo pipefail
          cat dist/.key-* > dist/BUILD-KEYS.txt
          rm -f dist/.key-*
          sort -o dist/BUILD-KEYS.txt dist/BUILD-KEYS.txt
          echo "BUILD-KEYS.txt: $(wc -l < dist/BUILD-KEYS.txt) recipes"

      # Checksums are generated here rather than per-recipe: each build
      # job only sees its own packages, so a per-job SHA256SUMS file
      # would cover a fraction of the release and the last one uploaded
      # would win.
      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          for arch in arm64-apple-darwin x86_64-apple-darwin; do
            if ls unflab-*-"$arch".tar.gz >/dev/null 2>&1; then
              shasum -a 256 unflab-*-"$arch".tar.gz > "SHA256SUMS-$arch.txt"
              echo "SHA256SUMS-$arch.txt: $(wc -l < "SHA256SUMS-$arch.txt") entries"
            fi
          done

      # index.txt is what `get` reads to resolve a name to a release
      # asset. The generator writes it, rather than this workflow
      # rebuilding the same thing in YAML -- the column layout is a
      # contract with `get`, and one definition of it is enough.
      - name: Generate index.txt
        run: |
          set -euo pipefail
          scripts/generate-docs.py >/dev/null
          cp site-extra/index.txt dist/index.txt

      # ...then check it against the archives that actually exist, so a
      # recipe that failed to produce one can't ship an index promising
      # a download that 404s.
      - name: Check every indexed package has an archive
        run: |
          set -euo pipefail
          missing=0
          while IFS=$'\t' read -r name recipe version; do
            [ -n "$name" ] || continue
            if ! ls dist/unflab-"$name"-"$version"-*.tar.gz >/dev/null 2>&1; then
              echo "no archive for $name $version" >&2
              missing=$((missing + 1))
            fi
          done < dist/index.txt
          [ "$missing" -eq 0 ] || exit 1
          echo "index.txt: $(wc -l < dist/index.txt) packages, all present"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS-*.txt
            dist/index.txt
            dist/BUILD-KEYS.txt
          generate_release_notes: true
