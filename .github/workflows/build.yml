name: Build

# One job per recipe per architecture, so a broken recipe fails alone
# instead of taking the whole matrix with it. Previously `make all` ran
# the recipes serially and aborted on the first failure, which meant one
# bad recipe hid the state of every recipe after it -- and each retry
# rebuilt everything.
#
# The matrix is generated from utils/, so adding a recipe never means
# editing this file.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read
  # To find the last green build on main; see the recipes job.
  actions: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recipes:
    name: List recipes
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Needed to diff against the base branch below.
          fetch-depth: 0
      - id: list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          all=$(scripts/resolve.sh list-recipes)

          # Build only what the diff can affect, on pushes as well as
          # pull requests. Merging a one-recipe bump used to rebuild
          # all utils.
          #
          # scripts/affected.sh maps changed files to recipes, and is
          # where the reasoning lives -- what changes every artefact,
          # what is scoped to the recipes that source it, and what
          # cannot reach an artefact at all. It defaults to everything
          # for a path it does not recognise, so a new file can never
          # silently skip a build.
          names="$all"
          changed=""
          case "${{ github.event_name }}" in
            pull_request)
              changed=$(git diff --name-only \
                "origin/${{ github.base_ref }}"...HEAD)
              ;;
            push)
              # Diff against the last commit a Build run on main passed
              # at, not the previous push. Every push to main shares one
              # concurrency group, so a merge cancels the build of the
              # one before it; diffing from the previous push would
              # then leave that merge built by nothing. A cancelled or
              # failed run never becomes the baseline, so its changes
              # carry forward until a run passes.
              #
              # No green run, or one not in this history (a force-push)
              # -- build everything.
              base=$(gh run list --repo "$GITHUB_REPOSITORY" \
                       --workflow build.yml --branch main --status success \
                       --limit 20 --json headSha,event \
                       -q '[.[] | select(.event != "pull_request")][0].headSha // empty' \
                     || true)
              if [ -n "$base" ] && git cat-file -e "$base^{commit}" 2>/dev/null \
                 && git merge-base --is-ancestor "$base" HEAD; then
                echo "Last green build on main: $base"
                changed=$(git diff --name-only "$base" HEAD)
                # Already green at this very commit (a re-run): the
                # diff is empty, and there is nothing new to prove.
                [ -n "$changed" ] || { names=""; }
              else
                echo "No usable green build on main -- building everything."
              fi
              ;;
          esac

          if [ -n "$changed" ]; then
            echo "Changed files:"; echo "$changed" | sed 's/^/  /'
            # shellcheck disable=SC2086
            names=$(scripts/affected.sh $changed)
          fi

          # No recipe is affected -- a docs or tooling change. Emit an
          # empty matrix rather than a job: `if` on the build job skips
          # it, and the aggregate still reports success.
          if [ -z "$names" ]; then
            echo "No recipe affected -- nothing to build."
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          json=$(printf '%s\n' $names | jq -R . | jq -sc .)
          echo "matrix=$json" >> "$GITHUB_OUTPUT"
          echo "Building: $(echo $names | tr '\n' ' ')"

  build:
    name: ${{ matrix.recipe }} (${{ matrix.target.arch }})
    needs: recipes
    # An empty matrix is a docs or tooling change that affects no recipe.
    if: needs.recipes.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        recipe: ${{ fromJSON(needs.recipes.outputs.matrix) }}
        target:
          - runner: macos-latest
            arch: arm64-apple-darwin

          ## Intel is disabled for now to halve runner cost and turnaround.
          ## Now macos is deprecating Intel, the platforms are diverging so
          ## far more likely to have unique bugs on each platform, which is
          ## more trouble than it's worth.... just use Homebrew!
          # - runner: macos-15-intel
          #   arch: x86_64-apple-darwin
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@v7

      # Toolchain setup, build and package all live in the composite
      # action, so this workflow and release.yml cannot drift apart.
      - uses: ./.github/actions/build-recipe
        with:
          recipe: ${{ matrix.recipe }}
          arch: ${{ matrix.target.arch }}

      # The gate again, against what will actually ship: packaging is
      # where a wrong file could creep in.
      - name: Verify shipped archives
        run: |
          set -euo pipefail
          mkdir -p /tmp/verify
          for a in dist/*.tar.gz; do
            d=/tmp/verify/$(basename "$a" .tar.gz)
            mkdir -p "$d"
            tar xzf "$a" -C "$d"
            scripts/verify.sh "$d"
          done

      - name: Litmus test
        run: scripts/litmus-test.sh ${{ matrix.target.arch }}

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.recipe }}-${{ matrix.target.arch }}
          path: |
            dist/*.tar.gz
          if-no-files-found: error

  # A single green check to require on the branch, so the protection rule
  # doesn't need updating every time a recipe is added.
  all:
    name: All recipes built
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ contains(needs.build.result, 'failure') || contains(needs.build.result, 'cancelled') }}" = "true" ]; then
            echo "One or more recipes failed."
            exit 1
          fi
          echo "All recipes built and passed the litmus test."
