name: Build

# Builds every utility on both architectures and enforces the gate.
# Runs on push and PR so a broken recipe is caught before a tag is cut.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

# A full build is ~115 packages across two architectures and takes a
# while. Without this, a run of pushes queues up behind itself and every
# superseded run still burns a runner. Only the newest commit's result
# matters, so cancel the rest.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64-apple-darwin
          - runner: macos-15-intel
            arch: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # Recipes declare what they need via UNFLAB_TOOLCHAIN. Go is cached
      # on the runner image but is NOT on PATH until setup-go activates
      # it, so a Go recipe fails with "go: command not found" without
      # this. Conditioned on the recipes rather than always-on, so the
      # step disappears if no recipe needs Go.
      - id: toolchains
        run: |
          set -euo pipefail
          need() { grep -qh "^UNFLAB_TOOLCHAIN=.*\\b$1\\b" utils/*/recipe.sh && echo true || echo false; }
          echo "go=$(need go)" >> "$GITHUB_OUTPUT"
          echo "rust=$(need rust)" >> "$GITHUB_OUTPUT"

      - if: steps.toolchains.outputs.go == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false

      - name: Build all utilities
        run: make all

      - name: Package
        run: scripts/package.sh ${{ matrix.arch }}

      # The gate again, against what will actually be shipped, not just
      # what was staged: packaging is where a wrong file could creep in.
      - name: Verify shipped archives link only system libraries
        run: |
          set -euo pipefail
          mkdir -p /tmp/verify
          for a in dist/*.tar.gz; do
            d=/tmp/verify/$(basename "$a" .tar.gz)
            mkdir -p "$d"
            tar xzf "$a" -C "$d"
            scripts/verify.sh "$d"
          done

      - name: Litmus test -- install and run with no Homebrew on PATH
        run: scripts/litmus-test.sh ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS-*.txt
          if-no-files-found: error
