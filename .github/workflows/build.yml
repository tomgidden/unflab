name: Build

# One job per recipe per architecture, so a broken recipe fails alone
# instead of taking the whole matrix with it. Previously `make all` ran
# the recipes serially and aborted on the first failure, which meant one
# bad recipe hid the state of every recipe after it -- and each retry
# rebuilt everything.
#
# The matrix is generated from utils/, so adding a recipe never means
# editing this file.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recipes:
    name: List recipes
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Needed to diff against the base branch below.
          fetch-depth: 0
      - id: list
        run: |
          set -euo pipefail
          all=$(ls -d utils/*/ | xargs -n1 basename | sort)

          # Build only what the diff can affect, on pushes as well as
          # pull requests. Merging a one-recipe bump used to rebuild
          # all sixteen: not because any job is slow, but because
          # sixteen jobs queue against a small macOS runner pool, and
          # the run takes ten minutes of wall clock to do thirty
          # seconds of useful work.
          #
          # Anything shared (the build driver, the installer template,
          # a lib/ helper, the workflow itself) still means everything,
          # because those change every artefact. That is the same rule
          # build-key.sh encodes for releases.
          names="$all"
          changed=""
          case "${{ github.event_name }}" in
            pull_request)
              changed=$(git diff --name-only \
                "origin/${{ github.base_ref }}"...HEAD)
              ;;
            push)
              # A merge commit's first parent is the previous main, so
              # this is the diff the merge introduced. On a force-push
              # or a new branch the before-SHA is all zeroes and there
              # is nothing to compare against -- build everything.
              before="${{ github.event.before }}"
              if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] \
                 && git cat-file -e "$before^{commit}" 2>/dev/null; then
                changed=$(git diff --name-only "$before" HEAD)
              else
                echo "No usable before-SHA -- building everything."
              fi
              ;;
          esac

          if [ -n "$changed" ]; then
            echo "Changed files:"; echo "$changed" | sed 's/^/  /'

            # True if any changed file is outside utils/ -- count the
            # ones that are inside and compare, rather than relying on
            # a negated grep whose exit status is easy to misread.
            total=$(echo "$changed" | grep -c .)
            in_utils=$(echo "$changed" | grep -cE '^utils/[^/]+/' || true)
            if [ "$total" -ne "$in_utils" ]; then
              echo "Shared files changed -- building everything."
            else
              names=$(echo "$changed" | sed -n 's|^utils/\([^/]*\)/.*|\1|p' \
                        | sort -u)
              [ -n "$names" ] || names="$all"
            fi
          fi

          json=$(printf '%s\n' $names | jq -R . | jq -sc .)
          echo "matrix=$json" >> "$GITHUB_OUTPUT"
          echo "Building: $(echo $names | tr '\n' ' ')"

  build:
    name: ${{ matrix.recipe }} (${{ matrix.target.arch }})
    needs: recipes
    strategy:
      fail-fast: false
      matrix:
        recipe: ${{ fromJSON(needs.recipes.outputs.matrix) }}
        # runner and arch travel together; listing arch separately as
        # well would produce a cross-product pairing each runner with
        # both triples.
        #
        # Intel is disabled for now to halve runner cost and turnaround.
        # Uncomment the second entry to build x86_64 again -- everything
        # else (packaging, the gate, the litmus test, releases) is
        # already arch-agnostic, so that is the only change needed.
        target:
          - runner: macos-latest
            arch: arm64-apple-darwin
          # - runner: macos-15-intel
          #   arch: x86_64-apple-darwin
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@v7

      - id: toolchains
        run: |
          set -euo pipefail
          need() { grep -qh "^UNFLAB_TOOLCHAIN=.*\b$1\b" "utils/${{ matrix.recipe }}/recipe.sh" && echo true || echo false; }
          echo "go=$(need go)" >> "$GITHUB_OUTPUT"
          echo "cmake=$(need cmake)" >> "$GITHUB_OUTPUT"

      - if: steps.toolchains.outputs.go == 'true'
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false

      # Pinned to 3.x deliberately: CMake 4 removed CMP0048's OLD
      # behaviour, which bloaty's vendored capstone requires.
      - if: steps.toolchains.outputs.cmake == 'true'
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "3.31.6"

      # Attestation is checked on the runner, where gpg and the network
      # are both available. Strict: evidence an upstream publishes must
      # actually be fetchable, or the build fails rather than quietly
      # downgrading to the pin alone.
      - name: Build
        env:
          UNFLAB_ATTEST_CHECK: "1"
          UNFLAB_ATTEST_STRICT: "1"
        run: scripts/build.sh ${{ matrix.recipe }}

      - name: Package
        run: scripts/package.sh ${{ matrix.target.arch }}

      # The gate again, against what will actually ship: packaging is
      # where a wrong file could creep in.
      - name: Verify shipped archives
        run: |
          set -euo pipefail
          mkdir -p /tmp/verify
          for a in dist/*.tar.gz; do
            d=/tmp/verify/$(basename "$a" .tar.gz)
            mkdir -p "$d"
            tar xzf "$a" -C "$d"
            scripts/verify.sh "$d"
          done

      - name: Litmus test
        run: scripts/litmus-test.sh ${{ matrix.target.arch }}

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.recipe }}-${{ matrix.target.arch }}
          path: |
            dist/*.tar.gz
          if-no-files-found: error

  # A single green check to require on the branch, so the protection rule
  # doesn't need updating every time a recipe is added.
  all:
    name: All recipes built
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ contains(needs.build.result, 'failure') || contains(needs.build.result, 'cancelled') }}" = "true" ]; then
            echo "One or more recipes failed."
            exit 1
          fi
          echo "All recipes built and passed the litmus test."
