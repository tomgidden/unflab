name: Debug attestation
on: { workflow_dispatch: {} }
jobs:
  t:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          set -uo pipefail
          curl -fsSL -o /tmp/wget.tgz https://ftp.gnu.org/gnu/wget/wget-1.25.0.tar.gz
          curl -fsSL -o /tmp/wget.sig https://ftp.gnu.org/gnu/wget/wget-1.25.0.tar.gz.sig
          curl -fsSL -o /tmp/gnu.gpg https://ftp.gnu.org/gnu/gnu-keyring.gpg
          H=/tmp/h$$; mkdir -p $H; chmod 700 $H
          gpg --homedir $H --batch --no-default-keyring --keyring /tmp/k.gpg \
            --import /tmp/gnu.gpg 2>&1 | tail -2
          echo "=== verify wget, full stderr:"
          gpg --homedir $H --batch --no-default-keyring --keyring /tmp/k.gpg \
            --verify /tmp/wget.sig /tmp/wget.tgz 2>&1 | tail -6
