name: Build a recipe
description: >
  Set up the toolchains a recipe declares, build it, and package the
  result. Shared by build.yml and release.yml so the two cannot drift.

inputs:
  recipe:
    description: Recipe name, i.e. a directory under utils/.
    required: true
  arch:
    description: Arch triple to package for, e.g. arm64-apple-darwin.
    required: true
  skip:
    description: >
      When "true", set up toolchains but do not build or package. The
      release workflow sets this once it has copied a previous
      release's archives forward, which leaves dist/ already populated.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # Which toolchains this recipe needs, read from its own
    # UNFLAB_TOOLCHAIN declaration, so adding a recipe never means
    # editing a workflow. Toolchains not listed here (rust) are taken
    # from the runner image as-is.
    - id: toolchains
      shell: bash
      run: |
        set -euo pipefail
        need() { grep -qh "^UNFLAB_TOOLCHAIN=.*\b$1\b" "utils/${{ inputs.recipe }}/recipe.sh" && echo true || echo false; }
        echo "go=$(need go)" >> "$GITHUB_OUTPUT"
        echo "cmake=$(need cmake)" >> "$GITHUB_OUTPUT"
        echo "autotools=$(need autotools)" >> "$GITHUB_OUTPUT"
        echo "pandoc=$(need pandoc)" >> "$GITHUB_OUTPUT"

    # check-latest: the runner image's cached Go drifts behind what a
    # recipe's go.mod needs.
    - if: steps.toolchains.outputs.go == 'true'
      uses: actions/setup-go@v7
      with:
        go-version: "1.26"
        check-latest: true
        cache: false

    # Pinned to 3.x deliberately: CMake 4 removed CMP0048's OLD
    # behaviour, which bloaty's vendored capstone requires.
    - if: steps.toolchains.outputs.cmake == 'true'
      uses: lukka/get-cmake@latest
      with:
        cmakeVersion: "3.31.6"

    # Most autotools recipes only run a ./configure the tarball already
    # ships, so the runner image not having autoconf went unnoticed
    # until duti -- which has to generate one, because upstream's
    # configure is made by a `dist` target the git tag archive predates.
    # Homebrew at build time is fine; verify.sh is what proves none of
    # it reached the artefact.
    - if: steps.toolchains.outputs.autotools == 'true'
      shell: bash
      run: brew list autoconf >/dev/null 2>&1 || brew install autoconf

    # Man pages generated from Markdown (btop, yq); the runner image has
    # no pandoc. Upstream's zip rather than brew, because it's one pinned
    # download that can never fall back to a source build. If the zip can't be had -- download failure, checksum
    # mismatch, an arch with no pinned sum -- brew is the fallback:
    # slower, but its bottles are verified too.
    - if: steps.toolchains.outputs.pandoc == 'true'
      shell: bash
      run: |
        set -uo pipefail
        v=3.11
        # Chained with && rather than relying on set -e: bash ignores
        # set -e inside a function called on the left of ||, so a
        # checksum mismatch would otherwise carry on and put the
        # unverified binary on PATH.
        from_zip() {
          local a sum z
          case "$RUNNER_ARCH" in
            ARM64) a=arm64; sum=15806bedf9517bfead72e88fe6a6696635c3691efbb6e152173440e9c5bb50b4 ;;
            *) echo "pandoc: no pinned checksum for $RUNNER_ARCH" >&2; return 1 ;;
          esac
          z="$RUNNER_TEMP/pandoc.zip"
          curl -fsSL --retry 2 -o "$z" "https://github.com/jgm/pandoc/releases/download/$v/pandoc-$v-$a-macOS.zip" &&
          echo "$sum  $z" | shasum -a 256 -c - &&
          unzip -q -o "$z" -d "$RUNNER_TEMP" &&
          "$RUNNER_TEMP/pandoc-$v-$a/bin/pandoc" --version | head -1 &&
          echo "$RUNNER_TEMP/pandoc-$v-$a/bin" >> "$GITHUB_PATH"
        }
        from_zip || {
          echo "::warning::pandoc $v zip unavailable; falling back to brew"
          brew install pandoc
        }

    # Attestation is checked on the runner, where gpg and the network
    # are both available. Strict: evidence an upstream publishes must
    # actually be fetchable, or the build fails rather than quietly
    # downgrading.
    - if: inputs.skip != 'true'
      name: Build
      shell: bash
      env:
        UNFLAB_ATTEST_CHECK: "1"
        UNFLAB_ATTEST_STRICT: "1"
      run: scripts/build.sh '${{ inputs.recipe }}'

    - if: inputs.skip != 'true'
      name: Package
      shell: bash
      run: scripts/package.sh '${{ inputs.arch }}'
